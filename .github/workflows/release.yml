name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  checks: read

jobs:
  # The tag points at a commit the branch push already ran CI on, and check runs
  # attach to the commit rather than the ref. Reading that result instead of
  # re-running the suite takes about nine minutes off every release. A commit
  # with missing, failed or still-running checks does not get built.
  require-green-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require green checks on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          required="validate validate-windows"
          # Tolerates tagging straight after the branch push, when the branch run
          # has not reported yet.
          for attempt in $(seq 1 40); do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" \
              --paginate --jq '.check_runs[] | "\(.name)=\(.status):\(.conclusion // "-")"' | sort -u)
            echo "$runs"
            pending=0
            for name in $required; do
              line=$(printf '%s\n' "$runs" | grep "^${name}=" | head -1 || true)
              case "$line" in
                "") pending=1 ;;
                *=completed:success) ;;
                *=completed:*) echo "::error::${line} on ${SHA}"; exit 1 ;;
                *) pending=1 ;;
              esac
            done
            if [ "$pending" = 0 ]; then
              echo "required checks are green on ${SHA}"
              exit 0
            fi
            sleep 30
          done
          echo "::error::required checks never reported green on ${SHA}"
          echo "::error::push the branch and let CI finish before tagging"
          exit 1

  release-windows:
    needs: require-green-ci
    runs-on: windows-latest
    # Normally ~3 min; a stalled runner should go red, not sit for 6 hours.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The tag is the version; package.json in the repo is only a dev placeholder.
      # Must run before install: editing package.json afterwards makes pnpm re-sync
      # deps inside the next `pnpm run`, which has wedged Windows runners.
      - name: Set version from tag
        shell: bash
        run: pnpm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release credentials
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            throw "Missing required release secret: GH_TOKEN"
          }

          $hasSigningCert = -not [string]::IsNullOrWhiteSpace($env:CSC_LINK)
          $hasSigningPassword = -not [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)
          if ($hasSigningCert -ne $hasSigningPassword) {
            throw "CSC_LINK and CSC_KEY_PASSWORD must be configured together"
          }

          if (-not $hasSigningCert) {
            Write-Warning "CSC_LINK/CSC_KEY_PASSWORD are not configured; building an unsigned Windows installer."
          }

      - name: Validate release runtime configuration
        env:
          VITE_WFM_BACKEND_URL: ${{ secrets.VITE_WFM_BACKEND_URL }}
          VITE_WFM_BACKEND_DIRECT_FALLBACK: ${{ vars.VITE_WFM_BACKEND_DIRECT_FALLBACK }}
          VITE_WFM_BACKEND_BOOTSTRAP_ENABLED: ${{ vars.VITE_WFM_BACKEND_BOOTSTRAP_ENABLED }}
        # node directly: the script has no deps, keep pnpm's run lifecycle out of it
        run: node scripts/validate-release-env.mjs

      - name: Ensure release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:GITHUB_REF_NAME already exists"
          } else {
            # Draft: paste the changelog, then Publish (which fires announce-release.yml).
            gh release create "$env:GITHUB_REF_NAME" `
              --repo "$env:GITHUB_REPOSITORY" `
              --title "$env:GITHUB_REF_NAME" `
              --draft `
              --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $env:GITHUB_REF_NAME" }
            Write-Host "Created draft release $env:GITHUB_REF_NAME"
          }

      - name: Remove existing release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $productName = $pkg.build.productName
          $version = $pkg.version
          $assets = @(
            "latest.yml",
            "$productName-$version-Setup.exe",
            "$productName-$version-Setup.exe.blockmap"
          )

          foreach ($asset in $assets) {
            gh release delete-asset "$env:GITHUB_REF_NAME" "$asset" --yes --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Deleted existing release asset: $asset"
            } else {
              Write-Host "Release asset not present or could not be deleted: $asset"
              $global:LASTEXITCODE = 0
            }
          }

      - name: Build Windows installer
        run: |
          pnpm run verify:onnx-models
          pnpm run build
          pnpm exec electron-builder --win nsis --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # baked into the renderer bundle; without these a CI installer
          # bypasses the worker backend
          VITE_WFM_BACKEND_URL: ${{ secrets.VITE_WFM_BACKEND_URL }}
          VITE_WFM_BACKEND_DIRECT_FALLBACK: ${{ vars.VITE_WFM_BACKEND_DIRECT_FALLBACK }}
          VITE_WFM_BACKEND_BOOTSTRAP_ENABLED: ${{ vars.VITE_WFM_BACKEND_BOOTSTRAP_ENABLED }}

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $productName = $pkg.build.productName
          $version = $pkg.version
          $paths = @(
            "release/latest.yml",
            "release/$productName-$version-Setup.exe",
            "release/$productName-$version-Setup.exe.blockmap"
          )

          foreach ($path in $paths) {
            if (-not (Test-Path $path)) {
              throw "Missing release asset: $path"
            }
          }

          gh release upload "$env:GITHUB_REF_NAME" $paths --clobber --repo "$env:GITHUB_REPOSITORY"

  # Linux AppImage into the same draft release (latest-linux.yml enables
  # electron-updater on linux). Runs after release-windows so the draft
  # already exists - no create race.
  release-linux:
    needs: [require-green-ci, release-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The tag is the version; package.json in the repo is only a dev placeholder.
      # Must run before install: editing package.json afterwards makes pnpm re-sync
      # deps inside the next `pnpm run`, which has wedged Windows runners.
      - name: Set version from tag
        shell: bash
        run: pnpm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release runtime configuration
        env:
          VITE_WFM_BACKEND_URL: ${{ secrets.VITE_WFM_BACKEND_URL }}
          VITE_WFM_BACKEND_DIRECT_FALLBACK: ${{ vars.VITE_WFM_BACKEND_DIRECT_FALLBACK }}
          VITE_WFM_BACKEND_BOOTSTRAP_ENABLED: ${{ vars.VITE_WFM_BACKEND_BOOTSTRAP_ENABLED }}
        # node directly: the script has no deps, keep pnpm's run lifecycle out of it
        run: node scripts/validate-release-env.mjs

      - name: Remove existing release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRODUCT_NAME=$(node -p "require('./package.json').build.productName")
          VERSION=$(node -p "require('./package.json').version")
          for asset in "latest-linux.yml" "$PRODUCT_NAME-$VERSION.AppImage"; do
            if gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes --repo "$GITHUB_REPOSITORY"; then
              echo "Deleted existing release asset: $asset"
            else
              echo "Release asset not present: $asset"
            fi
          done

      - name: Build Linux AppImage
        run: |
          pnpm run verify:onnx-models
          pnpm run build
          pnpm exec electron-builder --linux AppImage --publish never
        env:
          # baked into the renderer bundle; without these a CI installer
          # bypasses the worker backend
          VITE_WFM_BACKEND_URL: ${{ secrets.VITE_WFM_BACKEND_URL }}
          VITE_WFM_BACKEND_DIRECT_FALLBACK: ${{ vars.VITE_WFM_BACKEND_DIRECT_FALLBACK }}
          VITE_WFM_BACKEND_BOOTSTRAP_ENABLED: ${{ vars.VITE_WFM_BACKEND_BOOTSTRAP_ENABLED }}

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRODUCT_NAME=$(node -p "require('./package.json').build.productName")
          VERSION=$(node -p "require('./package.json').version")
          PATHS=("release/latest-linux.yml" "release/$PRODUCT_NAME-$VERSION.AppImage")
          for path in "${PATHS[@]}"; do
            if [ ! -f "$path" ]; then
              echo "Missing release asset: $path" >&2
              exit 1
            fi
          done
          gh release upload "$GITHUB_REF_NAME" "${PATHS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
